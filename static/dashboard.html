<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logon Event AI -- Live Alerts</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 2rem; }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  #status { color: #9aa0a6; font-size: 0.85rem; margin-bottom: 1.5rem; }
  .alert { border-left: 4px solid #555; background: #1a1d24; padding: 0.9rem 1rem; margin-bottom: 0.6rem; border-radius: 4px; }
  .alert .top { display: flex; justify-content: space-between; font-size: 0.8rem; color: #9aa0a6; }
  .alert .summary { margin-top: 0.4rem; font-size: 0.95rem; }
  .low { border-left-color: #4a90d9; }
  .medium { border-left-color: #e8b339; }
  .high { border-left-color: #e8752f; }
  .critical { border-left-color: #e14444; }
  .sev { text-transform: uppercase; font-weight: 600; letter-spacing: 0.03em; }
  .sev.low { color: #4a90d9; }
  .sev.medium { color: #e8b339; }
  .sev.high { color: #e8752f; }
  .sev.critical { color: #e14444; }
</style>
</head>
<body>
  <h1>Logon Event AI</h1>
  <div id="status">connecting...</div>
  <div id="feed"></div>

<script>
  const feed = document.getElementById('feed');
  const status = document.getElementById('status');
  const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${window.location.host}/ws/alerts`);

  ws.onopen = () => status.textContent = 'live \u2014 listening for anomalous logons';
  ws.onclose = () => status.textContent = 'disconnected';

  ws.onmessage = (msg) => {
    const a = JSON.parse(msg.data);
    const div = document.createElement('div');
    div.className = `alert ${a.severity}`;
    div.innerHTML = `
      <div class="top">
        <span>${a.user_id} &middot; event #${a.id}</span>
        <span class="sev ${a.severity}">${a.severity}</span>
      </div>
      <div class="summary">${a.summary}</div>
    `;
    feed.prepend(div);
  };
</script>
</body>
</html>
